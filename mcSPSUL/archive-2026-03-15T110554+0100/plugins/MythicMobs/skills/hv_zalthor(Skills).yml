  TargetConditions:
  - hasaura hv_zalthor_hammer_top_damage false
  Skills:
  - basedamage{m=3.5;pi=true}
  - throw{v=5;vy=0}
  - Aura{auraName=hv_zalthor_hammer_top_damage;duration=10}
  - shieldbreak{duration=100}
  
