  - lockmodel{l=true} @self
  - setai{ai=false} @self
  - delay 14
  - lockmodel{l=false} @self
  - setai{ai=true} @self
  - delay 20
  - setspeed{s=1} @self
  
hv_zalthor_hammer_top_totem_tick:
  Skills:
  - totem{ch=1;md=1;oH=hv_zalthor_hammer_top_damage;hr=2.5;vr=2.5;hnp=true;drawhitbox=false;ti=25} @modelpart{pid=hammer_t;o=model}
  
