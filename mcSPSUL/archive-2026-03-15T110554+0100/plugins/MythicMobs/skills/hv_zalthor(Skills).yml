hv_zalthor_active:
  Cooldown: 10
  Conditions:
  - targetwithin{d=20} true
  - hastag{t=hv_zalthor_active} false
  Skills:
  - gcd{ticks=44} @self
  - sound{s=hv_zalthor.spawn;v=2;p=0.8} @self
  - setspeed{s=0} @self
  - state{s=active} @self
  - lockmodel{l=false} @self 
  - defaultstate{t=idle;s=idle} @self
  - addtag{t=hv_zalthor_active} @self
  - delay 44
  - removetag{t=hv_zalthor_not_active} @self
  - setspeed{s=1} @self  

hv_zalthor_step:
  Conditions:
  - hastag{t=hv_zalthor_not_active} false
  - moving true
  - inblock{b=WATER,LAVA} false
  - offgcd
  Skills:
  - sound{s=hv_zalthor.step;v=1;p=1} @self
    
